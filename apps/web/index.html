<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Freeweight: rent any open model by the minute</title>
    <meta name="description" content="Open models sleep as stored weights and cost nothing. Wake one on a GPU, typically in a minute or two, and pay per GPU minute while your session runs. Never per token." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Freeweight" />
    <meta property="og:title" content="Freeweight: rent any open model by the minute" />
    <meta property="og:description" content="Models sleep as stored weights and cost nothing. Wake one, typically in a minute or two. Pay per GPU minute, never per token." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />

    <meta name="twitter:card" content="summary_large_image" />

    <script>
      try {
        var t = localStorage.getItem("fw_theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>

  <body>
    <div id="root"></div>
    <noscript>Freeweight needs JavaScript to wake a model. The API works without it: see /docs.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
