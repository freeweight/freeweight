name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base" 2>/dev/null; then base="$(git rev-list --max-parents=0 HEAD)"; fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"
          contracts=false; node=false
          if [ -f contracts/foundry.toml ] && echo "$files" | grep -qE '^(contracts/|\.github/)'; then contracts=true; fi
          if [ -f package-lock.json ] && echo "$files" | grep -qE '^(apps/|packages/|docs/|package(-lock)?\.json|\.github/)'; then node=true; fi
          {
            echo "contracts=$contracts"
            echo "node=$node"
          } >> "$GITHUB_OUTPUT"

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  # Fails if WeightVault.sol is not fully covered, lines and branches. The fork test needs a live
  # token address and is left out, as it is skipped without one anyway.
  contracts-coverage:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - run: forge coverage --no-match-path 'test/Fork.t.sol' --report summary --report lcov
      - name: WeightVault.sol at 100 % lines and branches
        run: |
          awk -v want=src/WeightVault.sol '
            /^SF:/ { f = (substr($0, 4) == want); if (f) seen = 1 }
            f && /^LF:/ { lf = substr($0, 4) } f && /^LH:/ { lh = substr($0, 4) }
            f && /^BRF:/ { brf = substr($0, 5) } f && /^BRH:/ { brh = substr($0, 5) }
            END {
              if (!seen) { print want " is not in lcov.info"; exit 1 }
              printf "%s: lines %d/%d, branches %d/%d\n", want, lh, lf, brh, brf
              if (lf == 0 || brf == 0 || lh != lf || brh != brf) exit 1
            }' lcov.info

  # Slither at a pinned version. High and medium findings fail the job unless they are listed,
  # with a reason, in contracts/slither-triage.toml.
  contracts-slither:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r ../.github/slither/requirements.txt
      # --fail-none: the gate below decides, against the triage file.
      - run: slither . --fail-none --json slither.json
      - run: python ../.github/slither/gate.py slither.json slither-triage.toml

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Known vulnerabilities in what ships (dev dependencies left out); fails on high or critical.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      # The site is built from docs/site: a page that is missing fails the build here.
      - run: npm run build
        env:
          FW_REQUIRE_DOCS: "1"

