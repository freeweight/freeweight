name: ci

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      node: ${{ steps.filter.outputs.node }}
      lane_baseten: ${{ steps.filter.outputs.lane_baseten }}
      lane_modal: ${{ steps.filter.outputs.lane_modal }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if ! git cat-file -e "$base" 2>/dev/null; then base="$(git rev-list --max-parents=0 HEAD)"; fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "$files"
          contracts=false; node=false; lane_baseten=false; lane_modal=false
          if [ -f contracts/foundry.toml ] && echo "$files" | grep -qE '^(contracts/|\.github/)'; then contracts=true; fi
          if [ -f package-lock.json ] && echo "$files" | grep -qE '^(apps/|packages/|docs/|package(-lock)?\.json|\.github/)'; then node=true; fi
          if [ -f serving/baseten/package-lock.json ] && echo "$files" | grep -qE '^(serving/baseten/|\.github/)'; then lane_baseten=true; fi
          if [ -f serving/modal/requirements-dev.txt ] && echo "$files" | grep -qE '^(serving/modal/|\.github/)'; then lane_modal=true; fi
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "lane_baseten=$lane_baseten" >> "$GITHUB_OUTPUT"
          echo "lane_modal=$lane_modal" >> "$GITHUB_OUTPUT"

  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vvv

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The site is built from docs/site: a page that is missing fails the build here.
      - run: npm run build
        env:
          FW_REQUIRE_DOCS: "1"

  # Each serving lane is a separately deployed package with its own lockfile.
  lane-baseten:
    needs: changes
    if: needs.changes.outputs.lane_baseten == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serving/baseten
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: serving/baseten/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Offline tests only: no provider SDK, GPU, network or secret.
  lane-modal:
    needs: changes
    if: needs.changes.outputs.lane_modal == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serving/modal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: serving/modal/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The offline tests do not load the platform modules, so a file that
      # does not parse or import would otherwise leave this job green.
      - run: python -m compileall -q fw_modal register.py bench.py
      - run: python -c "import fw_modal.app, fw_modal.lane, fw_modal.build"
      - run: python -m pytest -q
